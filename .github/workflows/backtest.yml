name: Radar — backtest

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Backtest des indicateurs
        env:
          BT_OUT: bt-out
        run: python engine/backtest.py
      - uses: actions/upload-artifact@v4
        with:
          name: backtest
          path: bt-out/
